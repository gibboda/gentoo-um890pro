name: Commit Message Validation

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commit-lint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}

      - name: Validate PR title
        id: pr_title
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          CONVENTIONAL_PATTERN='^(feat|fix|update|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .{1,100}$'
          # Generic terms that should not appear in PR titles from automation
          GENERIC_TERMS_PATTERN='(codex|copilot|ai|autogenerated|auto-generated|generated|bot|automation).*(pull request|pr|update|change|fix|patch)'
          # Vague descriptions that should not be used alone
          VAGUE_DESC_PATTERN='^(feat|fix|update|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?: (update code|fix issue|apply changes|make changes|update|fix|change)$'
          
          PR_TITLE=$(jq -r .pull_request.title < "$GITHUB_EVENT_PATH")
          PR_AUTHOR=$(jq -r .pull_request.user.login < "$GITHUB_EVENT_PATH")
          echo "PR title: $PR_TITLE"
          echo "PR author: $PR_AUTHOR"

          # Check if this is a Copilot/Codex PR
          IS_BOT_PR=false
          if echo "$PR_AUTHOR" | grep -Eqi '(copilot|codex|bot)'; then
            IS_BOT_PR=true
            echo "Detected bot/automation PR author"
          fi

          # First check conventional format (case-sensitive for type)
          if ! echo "$PR_TITLE" | grep -Eq "$CONVENTIONAL_PATTERN"; then
            echo "title_valid=false" >> "$GITHUB_OUTPUT"
            echo "title_generic=false" >> "$GITHUB_OUTPUT"
            echo "PR title does not follow Conventional Commits format."
            exit 0
          fi

          # For bot PRs, additionally check for generic terms and vague descriptions
          if [ "$IS_BOT_PR" = true ]; then
            if echo "$PR_TITLE" | grep -Eqi "$GENERIC_TERMS_PATTERN"; then
              echo "title_valid=false" >> "$GITHUB_OUTPUT"
              echo "title_generic=true" >> "$GITHUB_OUTPUT"
              echo "PR title contains generic terminology not allowed for bot PRs."
              echo "Avoid terms like 'Codex', 'Copilot', 'AI', 'autogenerated' and similar."
              exit 0
            fi
            if echo "$PR_TITLE" | grep -Eqi "$VAGUE_DESC_PATTERN"; then
              echo "title_valid=false" >> "$GITHUB_OUTPUT"
              echo "title_generic=true" >> "$GITHUB_OUTPUT"
              echo "PR title contains vague description not allowed for bot PRs."
              echo "Avoid vague descriptions like 'update code', 'fix issue', 'make changes'."
              exit 0
            fi
          fi

          echo "title_valid=true" >> "$GITHUB_OUTPUT"
          echo "title_generic=false" >> "$GITHUB_OUTPUT"
          echo "PR title follows Conventional Commits format and is descriptive."

      - name: Validate commit messages
        env:
          PR_TITLE_VALID: ${{ steps.pr_title.outputs.title_valid || 'false' }}
          PR_TITLE_GENERIC: ${{ steps.pr_title.outputs.title_generic || 'false' }}
        run: |
          set -euo pipefail
          
          # Legacy commits to skip (pre-enforcement)
          LEGACY_COMMITS="da8679f 1f5277a d8e7fda 5b49ddd ba55906 234d2c7 aa16958 bc761f5 bc09040 7f76d49 f8f60dd a559b3a 83144de 3986a11 ae8e4bc 3194a59 bd98962 6662f1d b671099 bdf347e 977e47d"
          
          # Conventional Commits pattern
          # Format: type[(scope)][!]: description
          # Types: feat|fix|update|docs|style|refactor|perf|test|build|ci|chore|revert
          CONVENTIONAL_PATTERN='^(feat|fix|update|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .{1,100}$'
          # Automation planning commits from bots use these subject prefixes
          SKIP_SUBJECT_PATTERN='^(Initial plan|Auto-generated plan)(:|$| -)'
          
          echo "Validating commits against Conventional Commits format..."
          echo "Pattern: type(scope): description"
          echo "Valid types: feat, fix, update, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo ""
          
          # Get list of commits in this PR
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
          COMMITS=$(git rev-list ${BASE_SHA}..HEAD)
          
          if [ -z "$COMMITS" ]; then
            echo "No commits found in this PR"
            exit 0
          fi
          
          INVALID_COUNT=0
          TITLE_INVALID=0
          TOTAL_COUNT=0

          if [ "${PR_TITLE_VALID}" != "true" ]; then
            TITLE_INVALID=1
            if [ "${PR_TITLE_GENERIC}" = "true" ]; then
              echo "PR title contains generic/vague description not allowed for Copilot/Codex PRs."
              echo "Avoid terms like 'Codex', 'Copilot', 'AI', 'autogenerated' and vague descriptions like 'update code', 'fix issue'."
            else
              echo "PR title did not pass the Conventional Commits check; this will be reported in the validation summary below."
              echo "Ensure the title matches the expected format: type[(scope)]: description"
            fi
            echo ""
          fi
          
          echo "Checking commits:"
          echo "----------------"
          
          for commit in $COMMITS; do
            TOTAL_COUNT=$((TOTAL_COUNT + 1))
            SUBJECT=$(git log -1 --format=%s "$commit")
            AUTHOR=$(git log -1 --format="%an" "$commit")
            SHORT_SHA=$(git log -1 --format=%h "$commit")
            
            echo ""
            echo "Commit: $SHORT_SHA"
            echo "Author: $AUTHOR"
            echo "Message: $SUBJECT"
            
            # Skip merge commits
            if echo "$SUBJECT" | grep -Eq '^Merge (branch|pull request|remote-tracking branch|[0-9a-f]{40})'; then
              echo "Status: ✓ SKIPPED (merge commit)"
              continue
            fi
            
            # Skip version bump commits from bump-version.sh
            if echo "$SUBJECT" | grep -Eq '^Bump version: [0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Status: ✓ SKIPPED (automated version bump)"
              continue
            fi
            
            # Skip legacy commits (pre-enforcement)
            if echo "$LEGACY_COMMITS" | grep -qw "$SHORT_SHA"; then
              echo "Status: ✓ SKIPPED (pre-enforcement legacy commit)"
              continue
            fi

            # Skip planning commits generated by automation
            if echo "$SUBJECT" | grep -Eq "$SKIP_SUBJECT_PATTERN"; then
              echo "Status: ✓ SKIPPED (automation planning commit)"
              continue
            fi
            
            # Validate against Conventional Commits format
            if echo "$SUBJECT" | grep -Eqi "$CONVENTIONAL_PATTERN"; then
              echo "Status: ✓ VALID"
              
              # Extract and display type (allow mixed case, normalize to lowercase)
              TYPE=$(echo "$SUBJECT" | sed -E 's/^([A-Za-z]+)(\([^)]+\))?!?: .*/\1/' | tr '[:upper:]' '[:lower:]')
              echo "Type: $TYPE"
              
              # Check for breaking change marker
              if echo "$SUBJECT" | grep -q '!:'; then
                echo "Breaking: YES (! marker)"
              fi
            else
              echo "Status: ✗ INVALID"
              INVALID_COUNT=$((INVALID_COUNT + 1))
              
              # Provide helpful feedback
              echo ""
              echo "This commit does not follow Conventional Commits format."
              echo ""
              echo "Expected format:"
              echo "  type(scope): description"
              echo "  type: description"
              echo ""
              echo "Valid types:"
              echo "  feat     - New feature"
              echo "  fix      - Bug fix"
              echo "  update   - Update or improvement"
              echo "  docs     - Documentation changes"
              echo "  style    - Code style changes (formatting)"
              echo "  refactor - Code refactoring"
              echo "  perf     - Performance improvements"
              echo "  test     - Test changes"
              echo "  build    - Build system changes"
              echo "  ci       - CI configuration changes"
              echo "  chore    - Other changes"
              echo "  revert   - Revert a previous commit"
              echo ""
              echo "Examples:"
              echo "  feat(rocm): add ROCm 7.1 support"
              echo "  fix(installer): resolve directory creation order"
              echo "  docs: update README installation steps"
              echo "  feat!: breaking change with ! marker"
              echo ""
            fi
          done
          
          echo ""
          echo "=================="
          echo "Validation Summary"
          echo "=================="
          echo "Total commits: $TOTAL_COUNT"
          echo "Invalid commits: $INVALID_COUNT"
          echo ""
          
          if [ $INVALID_COUNT -gt 0 ] || [ $TITLE_INVALID -gt 0 ]; then
            if [ $TITLE_INVALID -gt 0 ]; then
              if [ "${PR_TITLE_GENERIC}" = "true" ]; then
                echo "❌ FAILED: PR title contains generic/vague description."
                echo ""
                echo "Copilot/Codex PR titles must be specific and descriptive."
                echo "Avoid terms like 'Codex', 'Copilot', 'AI', 'autogenerated'."
                echo "Avoid vague descriptions like 'update code', 'fix issue', 'make changes'."
                echo ""
                echo "Good examples:"
                echo "  feat(installer): add validation for kernel options"
                echo "  fix(ci): handle empty commit messages in validation"
                echo "  docs: add ROCm installation prerequisites"
                echo ""
                echo "Bad examples:"
                echo "  fix: Codex-generated pull request"
                echo "  update: Copilot updates"
                echo "  feat: fix issue"
                echo ""
              else
                echo "❌ FAILED: PR title does not follow Conventional Commits format."
                echo ""
                echo "Fix the PR title to match the expected format, for example:"
                echo "  feat(installer): add validation for kernel options"
                echo "  docs: update installation requirements"
                echo ""
              fi
            fi

            if [ $INVALID_COUNT -gt 0 ]; then
              echo "❌ FAILED: $INVALID_COUNT commit(s) do not follow Conventional Commits format"
              echo ""
              echo "Please update your commit messages to match Conventional Commits."
            fi

            echo ""
            echo "See CONTRIBUTING.md for detailed guidelines."
            echo ""
            echo "To fix commits, use:"
            echo "  git rebase -i HEAD~${TOTAL_COUNT}"
            echo "  # Change 'pick' to 'reword' for invalid commits"
            echo "  # Update the commit messages"
            echo "  git push --force-with-lease"
            echo ""
            exit 1
          else
            echo "✓ SUCCESS: All commits follow Conventional Commits format"
            exit 0
          fi
