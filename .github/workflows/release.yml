name: Automated Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version to release (vX.Y.Z or X.Y.Z)'
        required: false
      message:
        description: 'Optional short changelog/release message'
        required: false
  push:
    branches: [ main ]
  pull_request:
    types: [labeled]

jobs:
  release:
    name: Create release (bump + tag)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Choose token (prefer REPO_PAT)
        id: choose_token
        env:
          GIT_TOKEN: ${{ secrets.REPO_PAT || github.token }}
          API_TOKEN: ${{ github.token }}
        run: |
          printf 'git_token=%s\n' "$GIT_TOKEN" >> "$GITHUB_OUTPUT"
          printf 'api_token=%s\n' "$API_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: vars
        run: |
          set -euo pipefail
          NEW_VERSION=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            LABEL_NAME=$(jq -r .label.name < "$GITHUB_EVENT_PATH" || true)
            if printf '%s' "$LABEL_NAME" | grep -Eq '^release[: ]*v?([0-9]+\.[0-9]+\.[0-9]+)$'; then
              NEW_VERSION=$(printf '%s' "$LABEL_NAME" | sed -E 's/^release[: ]*v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            fi
          fi
          if [ -z "$NEW_VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            NEW_VERSION=$(jq -r '.inputs.version // empty' < "$GITHUB_EVENT_PATH" || true)
            NEW_VERSION=${NEW_VERSION#v}
          fi
          if [ -z "$NEW_VERSION" ] && [ -f VERSION ]; then
            NEW_VERSION=$(cat VERSION | tr -d '\r\n')
          fi
          if [ -z "$NEW_VERSION" ]; then
            echo "No version determined" >&2
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run bump script (PR label)
        if: ${{ github.event_name == 'pull_request' && steps.vars.outputs.version != '' }}
        env:
          GIT_AUTH: ${{ steps.choose_token.outputs.git_token }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.vars.outputs.version }}"
          MSG=$(jq -r '.inputs.message // "Automated release"' < "$GITHUB_EVENT_PATH" 2>/dev/null || echo "Automated release")
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh "$NEW_VERSION" "$MSG"
          if [ -n "$GIT_AUTH" ]; then
            git remote set-url origin "https://x-access-token:${GIT_AUTH}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          # Attempt both pushes and report any failures explicitly
          set +e
          head_push_status=0
          tags_push_status=0
          git push origin HEAD || head_push_status=$?
          git push origin --tags || tags_push_status=$?
          set -e
          if [ "$head_push_status" -ne 0 ] || [ "$tags_push_status" -ne 0 ]; then
            echo "Error: git push failed (HEAD exit code: ${head_push_status}, tags exit code: ${tags_push_status})" >&2
            exit 1
          fi

      - name: Tag on push to main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GIT_AUTH: ${{ steps.choose_token.outputs.git_token }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.vars.outputs.version }}"
          if git show-ref --tags --quiet -- "refs/tags/v${NEW_VERSION}"; then
            echo "Tag exists; skipping"
            exit 0
          fi
          if [ -n "$GIT_AUTH" ]; then
            git remote set-url origin "https://x-access-token:${GIT_AUTH}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git tag -a "v${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"

      - name: Prepare release body
        id: prepare
        env:
          GIT_TOKEN: ${{ steps.choose_token.outputs.api_token }}
        run: |
          set -euo pipefail
          VER="${{ steps.vars.outputs.version }}"
          BODY=""
          if [ -f CHANGELOG.md ]; then
            excerpt=$(awk -v ver="$VER" '
              $0 ~ "^## \[" ver "\]" {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md || true)
            if [ -n "$excerpt" ]; then
              BODY="Changelog excerpt:\n\n$excerpt\n\n"
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            pr_title=$(jq -r .pull_request.title < "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            pr_body=$(jq -r .pull_request.body < "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            BODY="$BODY""PR: $pr_title\n\n$pr_body\n\n"
            commits_url=$(jq -r .pull_request.commits_url < "$GITHUB_EVENT_PATH" 2>/dev/null || true)
            if [ -n "$commits_url" ]; then
              commits_json=$(curl -s -H "Authorization: token $GIT_TOKEN" "$commits_url" || true)
              pr_commits=$(printf '%s' "$commits_json" | jq -r '.[] | "- " + ((.commit.message|split("\n")[0]) // "(no message)") + " (" + (.sha[0:7]) + ")"' || true)
              if [ -n "$pr_commits" ]; then
                BODY="$BODY""Commits:\n$pr_commits\n\n"
              fi
            fi
          fi
          if [ -z "$BODY" ]; then
            BODY="Automated release: v$VER"
          fi
          printf 'release_body<<EOF\n%s\nEOF\n' "$BODY" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub release
        id: release_check
        env:
          GITHUB_TOKEN: ${{ steps.choose_token.outputs.api_token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.vars.outputs.version }}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          status=$(curl -sS -o release.json -w "%{http_code}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api" || true)
          if [ "$status" = "200" ]; then
            rid=$(jq -r '.id' release.json)
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update existing GitHub release
        if: ${{ steps.release_check.outputs.exists == 'true' }}
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release_check.outputs.release_id }}
          RELEASE_NAME: v${{ steps.vars.outputs.version }}
          RELEASE_BODY: ${{ steps.prepare.outputs.release_body }}
        with:
          github-token: ${{ steps.choose_token.outputs.api_token }}
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const release_id = Number(process.env.RELEASE_ID);
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id,
              name: process.env.RELEASE_NAME,
              body: process.env.RELEASE_BODY,
            });

      - name: Create GitHub release
        if: ${{ steps.release_check.outputs.exists != 'true' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ steps.choose_token.outputs.api_token }}
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          release_name: v${{ steps.vars.outputs.version }}
          body: ${{ steps.prepare.outputs.release_body }}
