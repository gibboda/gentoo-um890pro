name: Version & Changelog Check

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'VERSION'
      - 'CHANGELOG.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and CHANGELOG.md
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          # Basic presence & format checks
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file missing" >&2
            exit 1
          fi
          VER=$(cat VERSION | tr -d '\r\n')
          echo "Found VERSION: $VER"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION must be in X.Y.Z semantic version format" >&2
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md missing" >&2
            exit 1
          fi

          # Determine the base SHA for the comparison range
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            BASE_SHA=$(jq -r .pull_request.base.sha < "$GITHUB_EVENT_PATH")
            HEAD_SHA=$(jq -r .pull_request.head.sha < "$GITHUB_EVENT_PATH")
          else
            BASE_SHA="${GITHUB_BEFORE:-}" || true
            HEAD_SHA="${GITHUB_SHA:-}" || true
          fi

          # Fallback: if variables empty, use git rev-parse
          BASE_SHA=${BASE_SHA:-$(git rev-parse HEAD~1)}
          HEAD_SHA=${HEAD_SHA:-$(git rev-parse HEAD)}

          echo "Comparing changes ${BASE_SHA}..${HEAD_SHA}"
          CHANGED_FILES=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" || true)
          echo "Changed files:\n$CHANGED_FILES"

          VERSION_CHANGED=0
          if echo "$CHANGED_FILES" | grep -q '^VERSION$'; then
            VERSION_CHANGED=1
          fi

          if [ "$VERSION_CHANGED" -eq 1 ]; then
            echo "VERSION changed in this update — verifying CHANGELOG.md was updated"
            if ! echo "$CHANGED_FILES" | grep -q '^CHANGELOG.md$'; then
              echo "ERROR: VERSION changed but CHANGELOG.md was not modified" >&2
              exit 1
            fi
            # Ensure CHANGELOG contains header for the new version
            if ! grep -q "## \[$VER\]" CHANGELOG.md; then
              echo "ERROR: CHANGELOG.md does not contain a header for version $VER" >&2
              exit 1
            fi
          else
            echo "VERSION not changed; basic validation only."
          fi

          echo "VERSION and CHANGELOG.md validation passed."
