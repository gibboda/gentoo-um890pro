name: Version & Changelog Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  version-check:
    name: Validate VERSION and CHANGELOG when VERSION changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine changed files
        id: determine
        run: |
          set -euo pipefail
          changed=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_ref=$(jq -r .pull_request.base.ref < "$GITHUB_EVENT_PATH")
            git fetch origin "$base_ref" --depth=1 || true
            changed=$(git diff --name-only origin/"$base_ref"...HEAD || true)
          else
            # push event - only run git diff if both variables are present
            if [ -n "${GITHUB_BEFORE:-}" ] && [ -n "${GITHUB_SHA:-}" ]; then
              changed=$(git diff --name-only "${GITHUB_BEFORE}".."${GITHUB_SHA}" || true)
            else
              # fallback to last commit diff
              changed=$(git diff --name-only HEAD~1..HEAD || true)
            fi
          fi

          printf 'changed_files<<EOF\n%s\nEOF\n' "$changed" >> "$GITHUB_OUTPUT"

      - name: Determine changelog requirement for user-visible changes
        id: changelog_requirement
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CHANGED_FILES: ${{ steps.determine.outputs.changed_files }}
        run: |
          set -euo pipefail
          pr_title=$(jq -r .pull_request.title < "$GITHUB_EVENT_PATH")
          label_names=$(jq -r '.pull_request.labels[].name' < "$GITHUB_EVENT_PATH" | tr '[:upper:]' '[:lower:]')

          base_sha=$(jq -r .pull_request.base.sha < "$GITHUB_EVENT_PATH")
          head_sha=$(jq -r .pull_request.head.sha < "$GITHUB_EVENT_PATH")
          git fetch origin "$base_sha" || true
          commit_subjects=$(git log --pretty=%s "${base_sha}..${head_sha}" 2>/dev/null || true)
          changed_files="${CHANGED_FILES:-}"

          requires_changelog=false
          label_pattern='^(feat|fix|perf|refactor|breaking|breaking-change)$'
          title_pattern='^(feat|fix|perf|refactor|breaking|breaking-change)(\([^)]+\))?(!)?:'

          if echo "$label_names" | grep -Eq "$label_pattern"; then
            requires_changelog=true
          elif echo "$pr_title" | tr '[:upper:]' '[:lower:]' | grep -Eq "$title_pattern"; then
            requires_changelog=true
          elif echo "$commit_subjects" | tr '[:upper:]' '[:lower:]' | grep -Eq "$title_pattern"; then
            requires_changelog=true
          fi

          if [ "$requires_changelog" = true ]; then
            non_ci_changes=$(echo "$changed_files" | grep -Ev '^(\.github/|CHANGELOG\.md$|VERSION$)' || true)
            if [ -z "$non_ci_changes" ]; then
              requires_changelog=false
              echo "Detected only CI/metadata changes; skipping changelog requirement."
            fi
          fi

          echo "requires_changelog=$requires_changelog" >> "$GITHUB_OUTPUT"
          echo "Requires changelog update: $requires_changelog"

      - name: Basic VERSION/CHANGELOG validation
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file missing" >&2
            exit 1
          fi
          VER=$(cat VERSION | tr -d '\r\n')
          echo "Found VERSION: $VER"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION must be in X.Y.Z semantic version format" >&2
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md missing" >&2
            exit 1
          fi

      - name: Check if VERSION file changed
        id: version_changed
        run: |
          set -euo pipefail
          if echo "${{ steps.determine.outputs.changed_files }}" | grep -q '^VERSION$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "VERSION file was changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "VERSION file was not changed"
          fi

      - name: Enforce Unreleased changelog policy for user-visible changes
        if: ${{ github.event_name == 'pull_request' && steps.changelog_requirement.outputs.requires_changelog == 'true' && steps.version_changed.outputs.changed != 'true' }}
        run: |
          set -euo pipefail
          # Note: We intentionally only match the root-level CHANGELOG.md here (not e.g. docs/CHANGELOG.md).
          if ! echo "${{ steps.determine.outputs.changed_files }}" | grep -q '^CHANGELOG.md$'; then
            echo "ERROR: CHANGELOG.md must be updated for user-visible changes." >&2
            exit 1
          fi

          if ! grep -Eq '^##[[:space:]]+\[?Unreleased\]?' CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md must include a '## [Unreleased]' section for user-visible changes." >&2
            exit 1
          fi

          if ! awk '
            BEGIN { in_unreleased=0; has_bullet=0 }
            /^##[[:space:]]+\[?Unreleased\]?/ { in_unreleased=1; next }
            /^##[[:space:]]+/ { if (in_unreleased && !has_bullet) exit 1; in_unreleased=0 }
            in_unreleased && /^[*-][[:space:]]+/ { has_bullet=1 }
            END { if (!has_bullet) exit 1 }
          ' CHANGELOG.md; then
            echo "ERROR: Add at least one bullet under ## [Unreleased] describing the user-visible change(s)." >&2
            exit 1
          fi

      - name: Verify changelog tags on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          git fetch --tags
          SKIP_TAGS=("v1.0.6" "v0.1.5")
          skip_tag() {
            local tag=$1
            for skip in "${SKIP_TAGS[@]}"; do
              if [ "$skip" = "$tag" ]; then
                return 0
              fi
            done
            return 1
          }
          missing_versions=()
          while IFS= read -r version; do
            tag="v${version}"
            if skip_tag "$tag"; then
              continue
            fi
            if ! git show-ref --tags --quiet -- "refs/tags/v${version}"; then
              missing_versions+=("v${version}")
            fi
          done < <(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          if [ "${#missing_versions[@]}" -ne 0 ]; then
            echo "ERROR: Missing git tags for CHANGELOG versions:" >&2
            printf '%s\n' "${missing_versions[@]}" >&2
            exit 1
          fi

      - name: Validate when VERSION changed
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "VERSION was modified in this change set. Running validations..."

          VERSION_VAL=$(cat VERSION | tr -d '\n' | tr -d '\r')
          echo "Found VERSION=${VERSION_VAL}"

          # Ensure CHANGELOG was modified in the patch
          if ! echo "${{ steps.determine.outputs.changed_files }}" | grep -q '^CHANGELOG.md$' ; then
            # Fallback: inspect git diff
            if ! git diff --name-only | grep -q '^CHANGELOG.md$'; then
              echo "ERROR: VERSION changed but CHANGELOG.md was not modified" >&2
              exit 1
            fi
          fi

          # Ensure CHANGELOG contains header for this version
          if ! grep -q "^## \[${VERSION_VAL}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain a header for version ${VERSION_VAL}" >&2
            exit 1
          fi

          # If this is a push to main, require tag presence
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            git fetch --tags || true
            if ! git tag -l "v${VERSION_VAL}" | grep -q "v${VERSION_VAL}" ; then
              echo "ERROR: Git tag v${VERSION_VAL} not found. Please create and push tag 'v${VERSION_VAL}' when releasing." >&2
              exit 1
            fi
          else
            echo "Skipping git tag check for non-push event (${GITHUB_EVENT_NAME})."
          fi

          echo "VERSION and CHANGELOG validation passed."

      - name: Skip when VERSION not changed
        if: steps.version_changed.outputs.changed == 'false'
        run: |
          echo "VERSION not changed; skipping validations."
