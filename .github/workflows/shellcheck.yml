name: ShellCheck

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked shell scripts
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked shell scripts were found."
            exit 0
          fi

          shellcheck --severity=error "${shell_files[@]}"
